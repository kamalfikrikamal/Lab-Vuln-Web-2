services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: teknobantu
      MYSQL_USER: teknobantu_app
      MYSQL_PASSWORD: teknobantu_app_pw
      MYSQL_ROOT_PASSWORD: teknobantu_root_pw
    volumes:
      - ./app/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./app/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - db-data:/var/lib/mysql
    # Tidak pernah expose port ke host - MySQL hanya boleh diakses dari service web.

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: teknobantu
      DB_USER: teknobantu_app
      DB_PASS: teknobantu_app_pw
    ports:
      - "8083:80"
    # Sengaja TIDAK ada cap_drop/security_opt/privileged di sini - default
    # capability set Docker diperlukan agar skenario privesc capabilities tetap berjalan.

volumes:
  db-data:
